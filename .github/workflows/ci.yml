name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake
          -S .
          -B build/ci
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON

      - name: Build
        run: >
          cmake
          --build build/ci
          --parallel 2

      - name: Test
        run: >
          ctest
          --test-dir build/ci
          --output-on-failure
